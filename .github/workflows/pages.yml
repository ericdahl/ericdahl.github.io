name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "apps/**"
      - "games/**"
      - ".github/scripts/site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys run one at a time and a running deploy is never cancelled midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build apps and games
        run: |
          set -euo pipefail
          mkdir -p _site
          : > _site/.dirs

          # npm projects with a build script are built and their dist/ published.
          for pkg in $(find apps games -name package.json -not -path '*/node_modules/*' | sort); do
            dir=$(dirname "$pkg")
            if ! jq -e '.scripts.build' "$pkg" >/dev/null; then continue; fi
            echo "::group::Building $dir"
            (cd "$dir" && npm ci && npm run build)
            mkdir -p "_site/$dir"
            cp -R "$dir/dist/." "_site/$dir/"
            echo "$dir" >> _site/.dirs
            echo "::endgroup::"
          done

          # Plain static pages (an index.html not inside a built npm project) are copied as-is.
          for html in $(find apps games -name index.html -not -path '*/node_modules/*' -not -path '*/dist/*' | sort); do
            dir=$(dirname "$html")
            d="$dir"; skip=0
            while [ "$d" != "." ]; do
              if [ -f "$d/package.json" ] && jq -e '.scripts.build' "$d/package.json" >/dev/null; then skip=1; break; fi
              d=$(dirname "$d")
            done
            [ "$skip" = 1 ] && continue
            mkdir -p "_site/$dir"
            cp -R "$dir/." "_site/$dir/"
            echo "$dir" >> _site/.dirs
          done

      # Writes the index, plus redirect stubs for paths that moved: everything under the
      # old /scratch/ project-site prefix, and apps moved out of games/.
      - name: Generate index and redirects
        run: |
          set -euo pipefail
          python3 .github/scripts/site.py _site $(sort -u _site/.dirs)
          rm _site/.dirs

      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
